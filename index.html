<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cloud Visitor Counter</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 80px; background-color: #f4f4f9; color: #333; }
        .counter-box { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #232f3e; }
        #counter { font-weight: bold; color: #ff9900; }
    </style>
</head>
<body>
    <div class="counter-box">
        <h1>AWS Serverless Project</h1>
        <p>This page has been viewed <span id="counter">Loading...</span> times.</p>
    </div>

    <script>
        fetch('https://xa7qlsf5n4.execute-api.eu-north-1.amazonaws.com/dev/counter')
            .then(response => response.json())
            .then(data => {
                document.getElementById('counter').innerText = data.visits;
            })
            .catch(error => {
                console.error('Error fetching count:', error);
                document.getElementById('counter').innerText = 'Error';
            });
    </script>
</body>
</html>
